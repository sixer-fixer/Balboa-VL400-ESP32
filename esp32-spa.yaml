substitutions:
  version: "3.2"

esphome:
  name: balboa-gs5xx
  friendly_name: balboa-gs5xx
  project:
    name: "kgstorm.balboa-gs5xx"
    version: ${version}

  on_boot:
    priority: -100
    then:
      - delay: 35s
      - script.execute: spa_mode_boot_read
      - script.wait: spa_mode_boot_read
      - delay: 25s
      - script.execute: filter_cycle_read

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

  actions:
    - action: set_spa_target_temperature
      variables:
        target_temp: float
      then:
        - script.execute:
            id: set_spa_target_temp
            target_temp: !lambda 'return target_temp;'

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: http_request
    id: ota_http

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp32-Spa Fallback Hotspot"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO

http_request:
  useragent: esphome/balboa-gs5xx
  timeout: 20s
  buffer_size_rx: 2048
  buffer_size_tx: 1024
  redirect_limit: 5

update:
  - platform: http_request
    name: "Firmware Update"
    source: https://kgstorm.github.io/Balboa-GS5xx/firmware/manifest.json
    update_interval: 6h

globals:
  - id: display_is_fahrenheit
    type: bool
    restore_value: true
    initial_value: 'false'

  - id: spa_mode_target
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: filter_duration_target
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: filter_frequency_target
    type: std::string
    restore_value: false
    initial_value: '""'

  - id: spa_temp_previous
    type: float
    restore_value: false
    initial_value: '0.0'

  - id: spa_temp_direction
    type: int
    restore_value: false
    initial_value: '0'

external_components:
  - source: esp32-spa
  
text_sensor:
  - platform: inputs
    parent_id: display_handler
    type: error_code
    name: "Spa Error Code"

  - platform: inputs
    parent_id: display_handler
    type: spa_mode
    id: spa_mode_state
    name: "Spa Mode"
    on_value:
      - if:
          condition:
            not:
              script.is_running: spa_mode_worker
          then:
            - lambda: |-
                if (x == "Standard" || x == "Economy" || x == "Sleep") {
                  id(spa_heating_mode).publish_state(x);
                  id(spa_mode_target) = x;
                }

  - platform: inputs
    parent_id: display_handler
    type: filter_cycle
    id: spa_filter_duration_state
    name: "Spa Filter Duration State"
    on_value:
      - if:
          condition:
            not:
              script.is_running: filter_cycle_worker
          then:
            - lambda: |-
                if (x == "F2" || x == "F4" || x == "F6" ||
                    x == "F8" || x == "FC") {
                  id(spa_filter_cycle).publish_state(x);
                  id(filter_duration_target) = x;
                }

  - platform: inputs
    parent_id: display_handler
    type: filter_frequency
    id: spa_filter_frequency_state
    name: "Spa Filter Frequency State"
    on_value:
      - if:
          condition:
            not:
              script.is_running: filter_cycle_worker
          then:
            - lambda: |-
                if (x == "2C" || x == "1d" || x == "1n") {
                  id(spa_filter_frequency).publish_state(x);
                  id(filter_frequency_target) = x;
                }

# ===== HOT TUB DISPLAY INPUTS =====
sensor:
  - platform: inputs
    id: display_handler
    measured_temp:
      name: "Spa Measured Temp"
      id: spa_measured_temp
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      device_class: temperature
      filters:
        - lambda: |-
            if (id(display_is_fahrenheit)) return (x - 32.0f) * 5.0f / 9.0f;
            return x;
    set_temp:
      name: "Spa Set Temp"
      id: spa_set_temp
      unit_of_measurement: "°C"
      accuracy_decimals: 1
      device_class: temperature
      filters:
        - lambda: |-
            if (id(display_is_fahrenheit)) return (x - 32.0f) * 5.0f / 9.0f;
            return x;

binary_sensor:
  - platform: inputs
    parent_id: display_handler
    type: heater
    name: "Spa Heater Status"
  - platform: inputs
    parent_id: display_handler
    type: pump
    name: "Spa Pump Status"
  - platform: inputs
    parent_id: display_handler
    type: light
    name: "Spa Light Status"

number:
  - platform: template
    name: "Spa High Temperature"
    id: spa_high_target_temp
    icon: "mdi:thermometer-high"
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 26.7
    max_value: 40
    step: 0.1
    initial_value: 40
    restore_value: false
    optimistic: true

  - platform: template
    name: "Spa Low Temperature"
    id: spa_low_target_temp
    icon: "mdi:thermometer-low"
    unit_of_measurement: "°C"
    device_class: temperature
    min_value: 26.7
    max_value: 40
    step: 0.1
    initial_value: 26.7
    restore_value: false
    optimistic: true

select:
  - platform: template
    name: "Spa Display Unit"
    id: spa_display_unit
    icon: "mdi:thermometer"
    options:
      - "°C"
      - "°F"
    initial_option: "°C"
    restore_value: true
    optimistic: true
    on_value:
      - globals.set:
          id: display_is_fahrenheit
          value: !lambda 'return x == "°F";'

  - platform: template
    name: "Spa Heating Mode"
    id: spa_heating_mode
    icon: "mdi:hot-tub"
    options:
      - "Standard"
      - "Economy"
      - "Sleep"
    optimistic: false

    set_action:
      # Store the latest requested mode and immediately show it
      # in Home Assistant/Homey.
      - lambda: |-
          id(spa_mode_target) = x;
          id(spa_heating_mode).publish_state(x);

      # The worker always works towards the latest target.
      - script.execute: spa_mode_worker

  - platform: template
    name: "Spa Filter Cycle"
    id: spa_filter_cycle
    icon: "mdi:filter"
    options:
      - "F2"
      - "F4"
      - "F6"
      - "F8"
      - "FC"
    optimistic: false

    set_action:
      - lambda: |-
          id(filter_duration_target) = x;
          id(spa_filter_cycle).publish_state(x);

      - script.execute: filter_cycle_worker

  - platform: template
    name: "Spa Filter Frequency"
    id: spa_filter_frequency
    icon: "mdi:calendar-clock"
    options:
      - "2C"
      - "1d"
      - "1n"
    optimistic: false

    set_action:
      - lambda: |-
          id(filter_frequency_target) = x;
          id(spa_filter_frequency).publish_state(x);

      - script.execute: filter_cycle_worker

script:
  # Read the current heating mode without toggling the physical light.
  - id: spa_mode_boot_read
    mode: single
    then:
      - repeat:
          count: 3
          then:
            - script.execute: spa_mode_step
            - script.wait: spa_mode_step

  # Move the spa towards the latest requested heating mode.
  - id: spa_mode_worker
    mode: single
    then:
      - repeat:
          count: 8
          then:
            - if:
                condition:
                  lambda: |-
                    return id(spa_mode_state).state != id(spa_mode_target);
                then:
                  - script.execute: spa_mode_step
                  - script.wait: spa_mode_step

      # If the target was not reached after all retries,
      # restore the dropdown to the actual spa state.
      - if:
          condition:
            lambda: |-
              return id(spa_mode_state).state != id(spa_mode_target);
          then:
            - lambda: |-
                const auto mode = id(spa_mode_state).state;
                if (mode == "Standard" ||
                    mode == "Economy" ||
                    mode == "Sleep") {
                  id(spa_heating_mode).publish_state(mode);
                  id(spa_mode_target) = mode;
                }

  # One physical Temp + Light mode-change sequence.
  - id: spa_mode_step
    mode: single
    then:
      - output.turn_on: spa_temp_out
      - delay: 100ms
      - output.turn_off: spa_temp_out
      - delay: 500ms
      - output.turn_on: spa_lights_out
      - delay: 100ms
      - output.turn_off: spa_lights_out
      - delay: 1000ms

  # Read the current filter-cycle duration without changing it.
  - id: filter_cycle_read
    mode: single
    then:
      # TEMP: begin programming sequence.
      - output.turn_on: spa_temp_out
      - delay: 100ms
      - output.turn_off: spa_temp_out
      - delay: 500ms

      # JETS: enter filter duration menu.
      - output.turn_on: spa_jets_out
      - delay: 100ms
      - output.turn_off: spa_jets_out
      - delay: 1500ms

      # At this point the display shows:
      # F2 / F4 / F6 / F8 / FC

      # JETS: advance to filter frequency menu.
      - output.turn_on: spa_jets_out
      - delay: 100ms
      - output.turn_off: spa_jets_out
      - delay: 1000ms

      # At this point the display shows:
      # 2C / 1d / 1n

      # JETS: exit programming.
      - output.turn_on: spa_jets_out
      - delay: 100ms
      - output.turn_off: spa_jets_out
      - delay: 500ms

  # Enter the filter menu, set the requested duration and frequency,
  # then leave the menu with JETS.
  - id: filter_cycle_worker
    mode: single
    then:
      # Do nothing if either target is not known yet.
      - if:
          condition:
            lambda: |-
              return id(filter_duration_target).empty() ||
                     id(filter_frequency_target).empty();
          then:
            - logger.log: "Filter worker skipped: duration/frequency target not initialized"
            - script.stop: filter_cycle_worker

      # TEMP: begin programming sequence.
      - output.turn_on: spa_temp_out
      - delay: 100ms
      - output.turn_off: spa_temp_out
      - delay: 500ms

      # JETS: enter filter duration menu.
      - output.turn_on: spa_jets_out
      - delay: 100ms
      - output.turn_off: spa_jets_out
      - delay: 1500ms

      # Cycle duration:
      # F2 -> F4 -> F6 -> F8 -> FC
      - repeat:
          count: 5
          then:
            - if:
                condition:
                  lambda: |-
                    return id(spa_filter_duration_state).state !=
                           id(filter_duration_target);
                then:
                  - script.execute: filter_cycle_step
                  - script.wait: filter_cycle_step

      # JETS: advance to frequency menu.
      - output.turn_on: spa_jets_out
      - delay: 100ms
      - output.turn_off: spa_jets_out
      - delay: 1000ms

      # Cycle frequency:
      # 2C -> 1d -> 1n
      - repeat:
          count: 3
          then:
            - if:
                condition:
                  lambda: |-
                    return id(spa_filter_frequency_state).state !=
                           id(filter_frequency_target);
                then:
                  - script.execute: filter_cycle_step
                  - script.wait: filter_cycle_step

      # JETS: exit programming.
      - output.turn_on: spa_jets_out
      - delay: 100ms
      - output.turn_off: spa_jets_out
      - delay: 500ms

      # Restore both selectors to the actual observed values.
      - lambda: |-
          const auto duration = id(spa_filter_duration_state).state;
          const auto frequency = id(spa_filter_frequency_state).state;

          if (duration == "F2" || duration == "F4" ||
              duration == "F6" || duration == "F8" ||
              duration == "FC") {
            id(spa_filter_cycle).publish_state(duration);
            id(filter_duration_target) = duration;
          }

          if (frequency == "2C" || frequency == "1d" ||
              frequency == "1n") {
            id(spa_filter_frequency).publish_state(frequency);
            id(filter_frequency_target) = frequency;
          }

  # One physical TEMP press while inside the filter-cycle menu.
  - id: filter_cycle_step
    mode: single
    then:
      - output.turn_on: spa_temp_out
      - delay: 100ms
      - output.turn_off: spa_temp_out
      - delay: 750ms

  - id: set_spa_target_temp
    mode: restart
    parameters:
      target_temp: float
    then:
      # Nothing to do if we're already at the requested temperature.
      - if:
          condition:
            lambda: |-
              return abs(id(spa_set_temp).state - target_temp) <= 0.5f;
          then:
            - script.stop: set_spa_target_temp

      # Remember which direction we actually want to travel.
      - lambda: |-
          id(spa_temp_direction) =
            target_temp > id(spa_set_temp).state ? 1 : -1;

      # First TEMP press brings up the set-temperature display.
      - button.press: btn_temp
      - delay: 700ms

      # Remember the starting setpoint.
      - lambda: |-
          id(spa_temp_previous) = id(spa_set_temp).state;

      # Second press gives us the first real movement.
      - button.press: btn_temp

      # Wait until the decoder sees the setpoint change.
      - wait_until:
          condition:
            lambda: |-
              return abs(id(spa_set_temp).state -
                         id(spa_temp_previous)) > 0.2f;
          timeout: 2500ms

      # Did that first movement go the wrong way?
      - if:
          condition:
            lambda: |-
              const float change =
                id(spa_set_temp).state - id(spa_temp_previous);

              return (id(spa_temp_direction) > 0 && change < 0) ||
                     (id(spa_temp_direction) < 0 && change > 0);
          then:
            # Stop touching TEMP long enough for the Balboa
            # to return to the normal current-temperature display.
            - logger.log:
                level: INFO
                format: "TEMP moved wrong direction; waiting for reversal"
            - delay: 5000ms

            # Start a fresh adjustment session.
            - button.press: btn_temp
            - delay: 700ms

            - lambda: |-
                id(spa_temp_previous) = id(spa_set_temp).state;

            - button.press: btn_temp

            - wait_until:
                condition:
                  lambda: |-
                    return abs(id(spa_set_temp).state -
                               id(spa_temp_previous)) > 0.2f;
                timeout: 2500ms

      # Now step toward the target, waiting for feedback
      # after every individual TEMP press.
      - repeat:
          count: 30
          then:
            - if:
                condition:
                  lambda: |-
                    return abs(id(spa_set_temp).state -
                               target_temp) > 0.5f;
                then:
                  - lambda: |-
                      id(spa_temp_previous) =
                        id(spa_set_temp).state;

                  - output.turn_on: spa_temp_out
                  - delay: 100ms
                  - output.turn_off: spa_temp_out
                  - delay: 700ms

# ===== BUTTONS (GPIO outputs) =====
output:
  - platform: gpio
    id: spa_lights_out
    pin: 25
    inverted: false
  - platform: gpio
    id: spa_temp_out
    pin: 26
    inverted: false
  - platform: gpio
    id: spa_jets_out
    pin: 27
    inverted: false
  - platform: gpio
    id: spa_blower_out
    pin: 32
    inverted: false

button:
  - platform: template
    id: btn_temp
    name: "Spa Temp"
    icon: "mdi:thermometer"
    on_press:
      - logger.log:
          level: INFO
          format: "Button pressed: TEMP"
      - output.turn_on: spa_temp_out
      - delay: 100ms
      - output.turn_off: spa_temp_out

  - platform: template
    name: "Spa Lights"
    icon: "mdi:lightbulb"
    on_press:
      - logger.log: "Button pressed: LIGHTS"
      - output.turn_on: spa_lights_out
      - delay: 100ms
      - output.turn_off: spa_lights_out

  - platform: template
    name: "Spa Jets"
    icon: "mdi:fan"
    on_press:
      - logger.log: "Button pressed: JETS"
      - output.turn_on: spa_jets_out
      - delay: 100ms
      - output.turn_off: spa_jets_out

  - platform: template
    name: "Spa Blower"
    icon: "mdi:weather-windy"
    on_press:
      - logger.log: "Button pressed: BLOWER"
      - output.turn_on: spa_blower_out
      - delay: 100ms
      - output.turn_off: spa_blower_out

  - platform: template
    name: "Set Spa High"
    icon: "mdi:thermometer-high"
    on_press:
      - script.execute:
          id: set_spa_target_temp
          target_temp: !lambda |-
            return id(spa_high_target_temp).state;

  - platform: template
    name: "Set Spa Low"
    icon: "mdi:thermometer-low"
    on_press:
      - script.execute:
          id: set_spa_target_temp
          target_temp: !lambda |-
            return id(spa_low_target_temp).state;

  - platform: restart
    name: "ESP Restart"
    entity_category: diagnostic